
# ========= sgo.musicses.vip (用于直连) =========
server {
    listen 443 ssl;
    server_name sgo.musicses.vip;

    ssl_certificate     ssl/sgo.musicses.vip/fullchain.crt;
    ssl_certificate_key ssl/sgo.musicses.vip/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        root  /var/www/html;   # ← 改成你网站文件的实际路径
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api {
        proxy_pass          http://127.0.0.1:8081;  # ← http，不是https
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}

server {
    listen 80;
    server_name sgo.musicses.vip;
    return 301 https://$host$request_uri;
}


# ========= sgos.musicses.vip (用于 CDN) =========
server {
    listen 443 ssl;
    server_name sgos.musicses.vip;

    ssl_certificate     ssl/sgos.musicses.vip/fullchain.crt;
    ssl_certificate_key ssl/sgos.musicses.vip/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 网站
    location / {
        root  /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # VLESS WebSocket 代理
    location /api {
        proxy_pass          http://127.0.0.1:8081;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}

# HTTP 跳转到 HTTPS（CDN 也会走这个）
server {
    listen 80;
    server_name sgos.musicses.vip;
    return 301 https://$host$request_uri;
}